# HARNESS DAG blueprint
# Defines generation layers and node dependencies for CODE_IMPL phase
# Loaded by orchestrator.py at runtime
version: "1.0"
layers:
  - id: foundation
    description: "Config, DTO, Enum foundation"
    nodes: ["G01", "G02", "G03"]
  - id: dependency
    description: "Dependency injection and providers"
    nodes: ["G04"]
  - id: business
    description: "Business adapters and notifications"
    nodes: ["G05", "G06"]
  - id: integration
    description: "Admin, SQL, i18n integration"
    nodes: ["G07", "G08", "G09"]

node_prerequisites:
  G01: []
  G02: ["G01"]
  G03: ["G02"]
  G04: ["G03"]
  G05: ["G04"]
  G06: ["G02", "G03"]
  G07: ["G01"]
  G08: ["G01"]
  G09: ["G02", "G07", "G08"]
